name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode package

      - name: Run against the sample file
        run: |
          chmod +x name-sorter
          ./name-sorter ./unsorted-names-list.txt
          test -s sorted-names-list.txt
